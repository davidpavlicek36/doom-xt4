name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e gh_release

      - name: Stage binaries
        run: |
          cp .pio/build/gh_release/bootloader.bin  docs/bootloader.bin
          cp .pio/build/gh_release/partitions.bin  docs/partitions.bin
          cp .pio/build/gh_release/firmware.bin    docs/doom-xt4.bin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docs/bootloader.bin
            docs/partitions.bin
            docs/doom-xt4.bin

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
